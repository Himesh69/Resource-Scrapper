# ============================================================
# KnowledgeFlow — Non-Critical Environment ConfigMap
# Contains non-sensitive configuration passed as env vars.
# These values are loaded via envFrom.configMapRef in the
# Deployment.
#
# For sensitive values (API keys, tokens), see the
# SecretProviderClass in Deployment.yaml which pulls from
# Azure Key Vault.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledgeflow-env
  labels:
    app: knowledgeflow
data:
  # ── LLM Provider ──────────────────────────────────────────
  GOOGLE_AI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"

  # ── Notion Database IDs ───────────────────────────────────
  # These are not secrets — they're public-facing database IDs.
  # Fill in your values from: python scripts/setup_notion.py
  NOTION_SOURCES_DB_ID: "<your-sources-db-id>"
  NOTION_RESOURCES_DB_ID: "<your-resources-db-id>"
  NOTION_CATEGORIES_DB_ID: "<your-categories-db-id>"
  NOTION_CREATORS_DB_ID: "<your-creators-db-id>"
  NOTION_KNOWLEDGE_DB_ID: "<your-knowledge-db-id>"

  # ── App Behaviour ─────────────────────────────────────────
  MAX_CONCURRENT_JOBS: "3"
  KEEP_CACHE: "false"
  LOG_LEVEL: "INFO"
