name: Sync main to Azure Repos

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for a clean mirror push

      - name: Push to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Construct the authentication URL robustly.
          # 1. Strip 'https://'
          # 2. Strip any existing username/password (anything before '@')
          # 3. Remove any hidden carriage returns (\r) that might come from Secrets
          URL_NO_SCHEME=$(echo "$AZURE_REPO_URL" | sed -e 's#^https://##' -e 's#.*@##' | tr -d '\r')
          CLEAN_PAT=$(echo "$AZURE_PAT" | tr -d '\r')
          AUTH_URL="https://PAT:${CLEAN_PAT}@${URL_NO_SCHEME}"

          git remote add azure "$AUTH_URL"
          git push azure HEAD:refs/heads/main --force
