name: Sync main to Azure Repos

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for a clean mirror push

      - name: Push to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Extract host+path from URL to inject PAT for auth
          AZURE_URL_NO_SCHEME=$(echo "$AZURE_REPO_URL" | sed -e 's#^https://##')
          AUTH_URL="https://PAT:${AZURE_PAT}@${AZURE_URL_NO_SCHEME}"

          git remote add azure "$AUTH_URL"
          git push azure HEAD:refs/heads/main --force