name: Sync main to Azure Repos

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for a clean mirror push

      - name: Push to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git remote add azure "$AZURE_REPO_URL"
          AUTH_HEADER=$(printf 'pat:%s' "$AZURE_PAT" | base64 | tr -d '\n')
          git -c http.extraheader="AUTHORIZATION: Basic ${AUTH_HEADER}" \
            push azure HEAD:refs/heads/main --force