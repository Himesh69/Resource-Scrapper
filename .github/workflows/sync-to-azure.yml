name: Sync main to Azure Repos

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for a clean mirror push

      - name: Push to Azure Repos
        env:
          AZURE_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_REPO_URL: ${{ secrets.AZURE_REPO_URL }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Use git config extraheader to inject the PAT as a basic auth token securely.
          # This avoids malformed URL errors (e.g., when the repo URL already has a username).
          # Base64 encode an empty username and the PAT.
          B64_PAT=$(printf "%s" ":$AZURE_PAT" | base64)
          git config http.extraheader "AUTHORIZATION: Basic $B64_PAT"

          git remote add azure "$AZURE_REPO_URL"
          git push azure HEAD:refs/heads/main --force